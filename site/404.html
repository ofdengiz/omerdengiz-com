<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — omerdengiz.com</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; text-align: center; padding: 24px; }
    .err-code {
      font-family: var(--font-mono);
      font-size: clamp(5rem, 18vw, 12rem);
      font-weight: 700;
      margin: 0;
      background: var(--grad-1);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      line-height: 1;
    }
    .err-msg { color: var(--text-dim); max-width: 520px; margin: 16px auto 28px; }
  </style>
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <main>
    <p class="err-code">404</p>
    <h1>Page not found</h1>
    <p class="err-msg">The route you requested doesn't live on this CloudFront distribution. Let's get you back.</p>
    <a href="/" class="btn btn-primary">Return home</a>
  </main>
  <script src="/assets/js/main.js" defer></script>
</body>
</html>
